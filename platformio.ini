; Whitlock seance display - one ESP32-S2-DevKitM-1 (ESP32-S2-MINI module, 4MB flash), Arduino framework.
; No DevKitM-1 board file exists in PlatformIO; esp32-s2-saola-1 is the same chip/flash and, like the
; DevKitM-1, has no native-USB console: Serial goes out UART0 through the board's USB-UART bridge.
; pioarduino = Arduino-ESP32 core 3.x. The code also has guards for core 2.x.
[env:devkitm1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s2-saola-1
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.9.0
